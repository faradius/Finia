# Despliega según la rama:
#   integration → DEV         (Finia DEV, com.devmastercrack.finia.dev)
#   qa          → QA          (Finia QA,  com.devmastercrack.finia.qa)
#   main        → PRODUCCIÓN  (Finia,     com.devmastercrack.finia) + GitHub Release con APK y AAB
#
# Cada ambiente es un "environment" de GitHub con sus propios secretos
# (FIREBASE_APP_ID y, en producción, la llave de release) y la variable FIREBASE_GROUPS.
name: Despliegue

on:
  push:
    branches: [integration, qa, main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  desplegar:
    name: ${{ github.ref_name == 'main' && 'produccion' || github.ref_name == 'qa' && 'qa' || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'produccion' || github.ref_name == 'qa' && 'qa' || 'dev' }}
    permissions:
      contents: write # para crear el GitHub Release de producción
    steps:
      - name: Elegir ambiente
        id: amb
        run: |
          case "${{ github.ref_name }}" in
            main)        echo "flavor=Prod"; echo "tipo=Release"; echo "nombre=produccion" ;;
            qa)          echo "flavor=Qa";   echo "tipo=Debug";   echo "nombre=qa" ;;
            integration) echo "flavor=Dev";  echo "tipo=Debug";   echo "nombre=dev" ;;
            *) echo "::error::La rama ${{ github.ref_name }} no despliega."; exit 1 ;;
          esac >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Restaurar la llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.FINIA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/finia.jks"

      - name: Tests y compilación
        env:
          FINIA_VERSION_CODE: ${{ github.run_number }}
          FINIA_KEYSTORE_PATH: ${{ runner.temp }}/finia.jks
          FINIA_KEYSTORE_PASSWORD: ${{ secrets.FINIA_KEYSTORE_PASSWORD }}
          FINIA_KEY_ALIAS: ${{ secrets.FINIA_KEY_ALIAS }}
          FINIA_KEY_PASSWORD: ${{ secrets.FINIA_KEY_PASSWORD }}
          V: ${{ steps.amb.outputs.flavor }}${{ steps.amb.outputs.tipo }}
        run: |
          chmod +x gradlew
          # Los tests unitarios corren sobre debug: test<Flavor>DebugUnitTest.
          TAREAS="test${{ steps.amb.outputs.flavor }}DebugUnitTest assemble${V}"
          [ "${{ steps.amb.outputs.nombre }}" = "produccion" ] && TAREAS="$TAREAS bundle${V}"
          ./gradlew $TAREAS
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Notas de la versión
        run: |
          {
            echo "[${{ steps.amb.outputs.nombre }}] ${VERSION_NAME} (${{ github.run_number }}) · $(git log -1 --format=%h)"
            git log -1 --format=%B
          } > "$RUNNER_TEMP/notas.txt"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Subir a Firebase App Distribution
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GRUPOS: ${{ vars.FIREBASE_GROUPS || 'testers' }}
        run: |
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          # El repo es público y sus logs también: se quitan los enlaces de descarga
          # de la APK (traen token) que imprime firebase-tools. pipefail conserva el
          # código de salida de firebase-tools si la subida falla.
          set -o pipefail
          npx --yes firebase-tools@14 appdistribution:distribute "$APK" \
            --app "$FIREBASE_APP_ID" \
            --groups "$GRUPOS" \
            --release-notes-file "$RUNNER_TEMP/notas.txt" 2>&1 \
            | sed -E '/app-binary-downloads|testerapps\//d'

      - name: GitHub Release (solo producción)
        if: steps.amb.outputs.nombre == 'produccion'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}-b${{ github.run_number }}"
          AAB=$(find app/build/outputs/bundle -name "*.aab" | head -1)
          gh release create "$TAG" "$APK" "$AAB" \
            --target "${{ github.sha }}" \
            --title "Finia ${VERSION_NAME} (${{ github.run_number }})" \
            --notes-file "$RUNNER_TEMP/notas.txt"
